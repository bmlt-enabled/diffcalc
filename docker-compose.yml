services:
  app:
    build: .
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - CONFIGURE_PASSWORD=${CONFIGURE_PASSWORD:-jimmyk1953}
      # For local development, uses file-based SQLite (no TURSO_DATABASE_URL means local file)
      # To test with Turso, set these environment variables:
      # - TURSO_DATABASE_URL=libsql://your-db.turso.io
      # - TURSO_AUTH_TOKEN=your-token
    volumes:
      - ./data:/app/data
